# 小筑生产部署 Compose —— 只部署 release tag 对应的不可变镜像版本。
#
# 这个镜像是「单容器双进程」：Uvicorn 对外监听 8000，Node Worker 仅在容器
# loopback 监听 8010。前端、API、构建和预览产物都由一个部署容器承载。
#
# 用法（服务器上）：
#   1. cp server/.env.example .env，再按 README 配置预览域名与密钥
#   2. 在 .env 设置 XIAOZHU_IMAGE_TAG 和 XIAOZHU_DATA_DIR；
#      Git tag release-v1.2.3 对应镜像 tag 1.2.3
#   3. docker login 到阿里云仓库（拉私有镜像需要）
#   4. docker compose pull && docker compose up -d
#   5. docker compose logs -f   # 看启动日志

services:
  xiaozhu:
    # 禁止默认 latest：没有显式指定 release 镜像版本时，Compose 直接拒绝启动。
    image: crpi-a7p27yxlrmekg1a3.cn-beijing.personal.cr.aliyuncs.com/elin/xiaozhu:${XIAOZHU_IMAGE_TAG:?请在 .env 设置 release 镜像版本}

    # 容器名固定，方便 docker logs / exec 时直接按名字操作
    container_name: xiaozhu

    # 把容器的 8000 映射到宿主机 8000。若服务器上 8000 被占用，
    # 改成 "8080:8000" 之类（左边宿主机口，右边容器口不要动）。
    ports:
      - "8000:8000"

    # 敏感配置（JWT、模型、沙箱密钥等）从同目录的 .env 文件注入，不写进 compose。
    env_file:
      - .env

    # 覆盖数据库路径，指向下面挂载的持久化目录 —— 否则 SQLite 文件落在
    # 容器内 /app/xiaozhu.db，容器一删数据就没了。
    # 注意 sqlite 的四个斜杠：//// 后面跟的是绝对路径 /app/data/xiaozhu.db。
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/xiaozhu.db
      - SANDBOX_WORKER_URL=http://127.0.0.1:8010
      - SANDBOX_PREVIEW_DIR=/app/data/sandbox-worker/previews
      - SANDBOX_DATA_DIR=/app/data/sandbox-worker
      - SANDBOX_TEMPLATE_DIR=/app/templates/vite-react

    # 把宿主机数据目录挂到容器 /app/data，让 SQLite 数据库文件持久化。
    # 生产环境必须把 XIAOZHU_DATA_DIR 配到面板内部目录之外，避免面板维护
    # 自身数据时递归修改权限；本地未配置时仍默认使用当前目录的 ./data。
    volumes:
      - ${XIAOZHU_DATA_DIR:-./data}:/app/data

    # 单容器的资源上限覆盖 API 与 Worker；Worker 自身仍保持单并发和构建超时。
    mem_limit: 1800m
    memswap_limit: 2800m
    cpus: 2.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # API 存活不代表 SQLite 可写；先校验数据目录和数据库文件，避免业务已 500
      # 时容器仍被 Docker 判定为 healthy。
      test: ["CMD-SHELL", "test -w /app/data && test -x /app/data && test -w /app/data/xiaozhu.db && /app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/setup-status', timeout=2); urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 5
    # 任一内部进程异常退出都会结束容器，由此处统一拉起。
    restart: unless-stopped
