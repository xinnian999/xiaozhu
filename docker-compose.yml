# 小筑 生产部署 compose —— 在服务器上直接 `docker compose up -d` 即可拉起。
#
# 这个镜像是「前后端同源单进程」：容器内 uvicorn 监听 8000，
# 既提供 API 又托管前端静态页。所以只需要暴露一个端口。
#
# 用法（服务器上）：
#   1. cp server/.env.example .env，再按 README 的 Compose 配置修改 Worker/预览地址与密钥
#   2. docker login 到阿里云仓库（拉私有镜像需要）
#   3. docker compose pull && docker compose up -d
#   4. docker compose logs -f   # 看启动日志

services:
  xiaozhu:
    # 阿里云个人版私有仓库里的镜像。:latest 可按需换成具体版本 tag。
    image: crpi-a7p27yxlrmekg1a3.cn-beijing.personal.cr.aliyuncs.com/elin/xiaozhu:latest

    # 容器名固定，方便 docker logs / exec 时直接按名字操作
    container_name: xiaozhu

    # 把容器的 8000 映射到宿主机 8000。若服务器上 8000 被占用，
    # 改成 "8080:8000" 之类（左边宿主机口，右边容器口不要动）。
    ports:
      - "8000:8000"

    # 敏感配置（JWT、模型、沙箱密钥等）从同目录的 .env 文件注入，不写进 compose。
    # 可从 server/.env.example 复制，随后按 README 改为 Compose 网络地址。
    env_file:
      - .env

    # 覆盖数据库路径，指向下面挂载的持久化目录 —— 否则 SQLite 文件落在
    # 容器内 /app/xiaozhu.db，容器一删数据就没了。
    # 注意 sqlite 的四个斜杠：//// 后面跟的是绝对路径 /app/data/xiaozhu.db。
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/xiaozhu.db
      - SANDBOX_WORKER_URL=http://sandbox-worker:8010
      - SANDBOX_PREVIEW_DIR=/app/data/sandbox-worker/previews

    # 把宿主机 ./data 挂到容器 /app/data，让 SQLite 数据库文件持久化。
    # 升级 / 重建容器后数据还在。
    volumes:
      - ./data:/app/data

    # 容器异常退出时自动重启；除非手动 stop，否则开机也会自启。
    restart: unless-stopped
    depends_on:
      sandbox-worker:
        condition: service_healthy

  # 固定的后端预览 Worker，与主服务一起启动。
  sandbox-worker:
    image: crpi-a7p27yxlrmekg1a3.cn-beijing.personal.cr.aliyuncs.com/elin/xiaozhu-sandbox:latest
    build:
      context: .
      dockerfile: sandbox-worker/Dockerfile
    container_name: xiaozhu-sandbox-worker
    environment:
      - SANDBOX_PORT=8010
      - SANDBOX_DATA_DIR=/data
      # 只注入 Worker 自己需要的专用密钥；绝不能把含模型/API 密钥的整份 .env
      # 传进执行构建任务的容器。
      - SANDBOX_WORKER_TOKEN=${SANDBOX_WORKER_TOKEN:?请在 .env 配置 SANDBOX_WORKER_TOKEN}
    # 仅绑定宿主机 loopback，方便「宿主机跑 API + Compose 跑 Worker」的开发方式；
    # 公网网卡不可访问。Compose 内主 API 仍使用 sandbox-worker:8010。
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./data/sandbox-worker:/data
    # 2C2G PoC 的硬边界：一次只构建一个任务，宁可单任务失败，也不能拖垮主站。
    mem_limit: 1200m
    memswap_limit: 1800m
    cpus: 1.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8010/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
